name: CI-linux64 (Static CentOS7)

on:
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Create new release'
        required: true
        type: boolean
  push:
    branches:
      - master

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  linux-x64:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install dependencies
        run: sudo apt update && sudo apt install -y build-essential cmake

      - name: Build 100% static
        run: |
          cmake -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_SHARED_LIBS=OFF \
            -DGGML_STATIC=ON \
            -DCMAKE_C_FLAGS="-static" \
            -DCMAKE_CXX_FLAGS="-static" \
            -DCMAKE_EXE_LINKER_FLAGS="-static -static-libgcc -static-libstdc++" \
            -DGGML_OPENMP=OFF \
            -DGGML_FORCE_OLD_ABI=ON \
            -DLLAMA_BUILD_EXAMPLES=ON \
            -DLLAMA_BUILD_TESTS=OFF \
            -DLLAMA_BUILD_TOOLS=ON \
            -DLLAMA_BUILD_SERVER=ON \
            -DGGML_RPC=ON \
            -DCMAKE_DISABLE_FIND_PACKAGE_OpenSSL=ON
          cmake --build build -j $(nproc)
          pwd
          ls ggml/

      # ======================
      # 调试：查找所有可执行文件
      # ======================
      - name: Find all built binaries
        run: |
          pwd
          echo "====================查找 llama-cli ===================="
          find build -name "llama-cli" -type f
          echo "====================查找 llama-server ===================="
          find build -name "llama-server" -type f
          echo "====================列出 build 目录结构 ===================="
          ls -laR build | head -100          

      - name: Check static
        run: |
          ls ggml/
          ldd build/bin/Release/llama-cli || echo "✅ 100% static"

      - name: Pack
        run: |
          cp LICENSE build/bin/Release/
          tar -czvf llama-bin-linux-x64-static-centos7.tar.gz -C build/bin/Release/ .

      - uses: actions/upload-artifact@v6
        with:
          path: llama-bin-linux-x64-static-centos7.tar.gz
          name: llama-bin-linux-x64-static-centos7

  release:
    if: ${{ github.event.inputs.create_release == 'true' }}
    permissions:
      contents: write
    runs-on: ubuntu-latest
    needs: [linux-x64]
    steps:
      - uses: actions/download-artifact@v7
        with:
          path: artifacts
      - name: Generate tag
        id: tag
        run: echo "tag=centos7-static-$(date +%Y%m%d-%H%M%S)" >> $GITHUB_OUTPUT
      - name: Create release
        uses: softprops/softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: Linux x64 Static (CentOS 7.9 Compatible)
          files: artifacts/llama-bin-linux-x64-static-centos7.tar.gz
