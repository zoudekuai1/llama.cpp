name: CI (Linux Static Only + CentOS7 Compatible)

on:
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Create new release'
        required: true
        type: boolean
  push:
    branches:
      - master
    paths:
      - '.github/workflows/release.yml'
      - '**/CMakeLists.txt'
      - '**/.cmake'
      - '**/*.h'
      - '**/*.hpp'
      - '**/*.c'
      - '**/*.cpp'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref && github.ref || github.run_id }}
  cancel-in-progress: true

env:
  BRANCH_NAME: ${{ github.head_ref || github.ref_name }}
  CMAKE_ARGS: "-DLLAMA_BUILD_EXAMPLES=OFF -DLLAMA_BUILD_TESTS=OFF -DLLAMA_BUILD_TOOLS=ON -DLLAMA_BUILD_SERVER=ON -DGGML_RPC=ON"

jobs:
  linux-x64:
    # 修复：用 GitHub 官方支持的 22.04，不再排队等待
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: 安装依赖
        run: sudo apt update && sudo apt install -y build-essential cmake

      - name: 编译 100% 静态链接（支持 CentOS 7.9）
        run: |
          cmake -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_SHARED_LIBS=OFF \
            -DGGML_STATIC=ON \
            -DLLAMA_STATIC=ON \
            -DCMAKE_C_FLAGS="-static -fPIC" \
            -DCMAKE_CXX_FLAGS="-static -fPIC" \
            -DCMAKE_EXE_LINKER_FLAGS="-static -static-libgcc -static-libstdc++ -no-pie" \
            -DGGML_OPENMP=OFF \
            -DGGML_FORCE_OLD_ABI=ON \
            ${{ env.CMAKE_ARGS }}
          cmake --build build --config Release -j $(nproc)

      - name: 验证无依赖
        run: |
          cd build/bin
          ldd llama-cli || echo "✅ 100% static"

      - name: 打包
        run: |
          cp LICENSE build/bin/
          tar -czvf llama-bin-linux-x64-static-centos7.tar.gz -C build/bin .

      - uses: actions/upload-artifact@v6
        with:
          path: llama-bin-linux-x64-static-centos7.tar.gz
          name: llama-bin-linux-x64-static-centos7.tar.gz

  release:
    if: ${{ github.event.inputs.create_release == 'true' }}
    permissions:
      contents: write
    runs-on: ubuntu-latest
    needs: [linux-x64]

    steps:
      - uses: actions/download-artifact@v7
        with:
          path: artifacts

      - name: 生成版本标签
        id: tag
        run: echo "tag=centos7-static-$(date +%Y%m%d-%H%M%S)" >> $GITHUB_OUTPUT

      - name: 发布 Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: Linux x64 Static (CentOS 7.9 兼容)
          files: artifacts/llama-bin-linux-x64-static-centos7.tar.gz
