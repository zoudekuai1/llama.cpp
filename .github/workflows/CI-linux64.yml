name: CI (Linux Static Only + CentOS7 Compatible)

on:
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Create new release'
        required: true
        type: boolean
  push:
    branches:
      - master

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref && github.ref || github.run_id }}
  cancel-in-progress: true

env:
  CMAKE_ARGS: "-DLLAMA_BUILD_EXAMPLES=OFF -DLLAMA_BUILD_TESTS=OFF -DLLAMA_BUILD_TOOLS=ON -DLLAMA_BUILD_SERVER=ON -DGGML_RPC=ON"

jobs:
  linux-x64:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      # 安装静态库（关键修复）
      - name: Install static dependencies
        run: sudo apt update && sudo apt install -y build-essential cmake libssl-dev libc6-dev

      - name: Build 100% static
        run: |
          cmake -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_SHARED_LIBS=OFF \
            -DGGML_STATIC=ON \
            -DLLAMA_STATIC=ON \
            -DLLAMA_LLAMACPP_DISABLE_VERSION_CHECK=ON \
            -DCMAKE_C_FLAGS="-static" \
            -DCMAKE_CXX_FLAGS="-static" \
            -DCMAKE_EXE_LINKER_FLAGS="-static -static-libgcc -static-libstdc++ -Wl,--whole-archive -lpthread -Wl,--no-whole-archive" \
            -DGGML_OPENMP=OFF \
            -DGGML_FORCE_OLD_ABI=ON \
            -DLLAMA_USE_OPENSSL=OFF  # 👈 彻底关闭 OpenSSL 动态依赖
            ${{ env.CMAKE_ARGS }}
          cmake --build build --config Release -j $(nproc)

      - name: Check static
        run: |
          cd build/bin
          ldd llama-cli || echo "✅ 100% static"

      - name: Pack
        run: |
          cp LICENSE build/bin/
          tar -czvf llama-bin-linux-x64-static-centos7.tar.gz -C build/bin .

      - uses: actions/upload-artifact@v6
        with:
          path: llama-bin-linux-x64-static-centos7.tar.gz
          name: llama-bin-linux-x64-static-centos7.tar.gz

  release:
    if: ${{ github.event.inputs.create_release == 'true' }}
    permissions:
      contents: write
    runs-on: ubuntu-latest
    needs: [linux-x64]
    steps:
      - uses: actions/download-artifact@v7
        with:
          path: artifacts
      - name: Generate tag
        id: tag
        run: echo "tag=centos7-static-$(date +%Y%m%d-%H%M%S)" >> $GITHUB_OUTPUT
      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: Linux x64 Static (CentOS 7.9 Compatible)
          files: artifacts/llama-bin-linux-x64-static-centos7.tar.gz
